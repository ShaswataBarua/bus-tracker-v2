<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to Login</title>
    <style>
      :root {
        --green-900: #0a5f3a;
        --green-700: #0d7a4c;
        --green-100: #eafaf1;
        --white: #ffffff;
        --text: #1d2b2f;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #edf9f1, #f8fcfa);
        color: var(--text);
      }

      .redirect-box {
        text-align: center;
        background: var(--white);
        border-radius: 18px;
        padding: 32px 28px;
        border: 1px solid rgba(10, 95, 58, 0.12);
        box-shadow: 0 20px 40px rgba(10, 95, 58, 0.08);
      }

      .brand {
        font-size: 2rem;
        font-weight: 800;
        color: var(--green-900);
        margin-bottom: 10px;
      }

      .message {
        font-size: 1rem;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="redirect-box">
      <div class="brand">BGC</div>
      <div class="message">Redirecting to the login portal...</div>
    </div>

    <script>
      window.location.href = './login.html';
    </script>
  </body>
</html>
